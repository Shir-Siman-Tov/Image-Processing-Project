[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipproj"
version = "0.1.0"
description = "Digital Image Processing course project: robustness of classical CV and DL methods under image degradations"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
